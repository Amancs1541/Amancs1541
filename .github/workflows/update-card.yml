name: Update profile card

on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  workflow_dispatch:             # "Run workflow" button
  push:
    paths: ["card/build.py", "card/fetch_stats.py", "card/photo_neon.png"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub stats and rebuild the card
        working-directory: card
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional PAT (scopes: repo, read:user) as secret GH_STATS_TOKEN to include private activity.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python fetch_stats.py
          python build.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card/profile.svg card/stats.json
          git diff --staged --quiet || (git commit -m "chore: update profile card" && git push)
